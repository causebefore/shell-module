# =============================================================
# Shell Module CI — 调用通用嵌入式 CI 工作流
# =============================================================

name: CI

on:
  push:
    branches: [master]
    paths:
      - "**.c"
      - "**.h"
      - "test/**"
      - ".github/workflows/**"
  pull_request:
    branches: [master]
    paths:
      - "**.c"
      - "**.h"
      - "test/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: causebefore/embedded-ci/.github/workflows/embedded-ci.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      source-files: "shell.c"
      include-dirs: "-I."
      arm-defines: "-DSHELL_USING_CMD_EXPORT=0 -DSHELL_USING_VAR=0"
      arm-cpus: '["cortex-m0","cortex-m3","cortex-m4"]'
      enable-format-check: true
      cppcheck-files: "shell.c shell.h shell_cfg.h"
      cppcheck-suppress: "missingIncludeSystem,unusedFunction,comparePointers"
      copilot-instructions: |
        这是一个 ARM Cortex-M 裸机嵌入式 CLI 模块。
        审查重点:
        - 禁止动态内存分配 (malloc/free)
        - 所有指针参数必须做 NULL 检查
        - ISR 安全: volatile、中断上下文中禁止阻塞
        - 禁止裸 int/short/long，使用 stdint.h 固定宽度类型
        - 缓冲区溢出检查
        - 栈使用量 (避免大局部数组)
