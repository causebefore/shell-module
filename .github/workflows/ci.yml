# =============================================================
# Shell Module CI — 嵌入式 C 模块持续集成
# =============================================================
# 触发条件: push/PR 到 master，且涉及源码或测试文件变更
# 流水线:
#   1. host-test    — 主机端 Unity 单元测试 (GCC, Linux)
#   2. arm-build    — ARM Cortex-M 交叉编译验证 (arm-none-eabi-gcc)
#   3. static-analysis — 静态分析 (cppcheck)
# =============================================================

name: CI

on:
  push:
    branches: [master]
    paths:
      - "**.c"
      - "**.h"
      - "test/**"
      - ".github/workflows/**"
  pull_request:
    branches: [master]
    paths:
      - "**.c"
      - "**.h"
      - "test/**"
      - ".github/workflows/**"

# ---- Job 1: 主机端单元测试 ----
jobs:
  host-test:
    name: Unity 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Unity 框架
        run: |
          cd test
          git clone --depth 1 https://github.com/ThrowTheSwitch/Unity.git unity

      - name: 编译测试
        run: |
          cd test
          make build

      - name: 运行测试
        run: |
          cd test
          make run

  # ---- Job 2: ARM 交叉编译 ----
  arm-build:
    name: ARM Cortex-M 编译检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 ARM 工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi

      - name: 编译核心模块 (仅语法检查)
        run: |
          arm-none-eabi-gcc \
            -c -mcpu=cortex-m4 -mthumb -std=c99 \
            -Wall -Wextra -Werror \
            -Wno-unused-parameter \
            -fsyntax-only \
            -DSHELL_USING_CMD_EXPORT=0 \
            -DSHELL_USING_VAR=0 \
            -I. \
            shell.c

  # ---- Job 3: 静态分析 ----
  static-analysis:
    name: Cppcheck 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck

      - name: 运行 cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I. \
            shell.c shell.h shell_cfg.h
